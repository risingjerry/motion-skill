name: Bug report
description: A script fails, a render looks wrong, or a check gives the wrong verdict
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: The command you ran and its full output
      render: text
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `python3 scripts/doctor.py --json`
      render: json
  - type: input
    id: env
    attributes:
      label: OS, Node, Python and Chrome versions
      placeholder: "macOS 15, Node 22, Python 3.12, Chrome 140"
  - type: markdown
    attributes:
      value: Please remove personal paths, names and any brand assets you are not allowed to share before posting.
